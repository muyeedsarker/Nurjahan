<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nurjahan.com — Sign in</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eff6ff,#f8fafc);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:#0f172a}.box{width:min(440px,calc(100% - 28px));padding:26px;border:1px solid #dbeafe;border-radius:22px;background:#fff;box-shadow:0 20px 60px #0f172a1f}h1{margin:0 0 6px}.muted{color:#64748b;font-size:14px}.submit{width:100%;margin-top:14px;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:900;font-size:15px}.input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px}label{display:block;font-weight:800;margin:12px 0 5px}.status{margin-top:12px;padding:10px;border-radius:10px;background:#f1f5f9;font-size:13px}.links{display:flex;gap:10px;justify-content:center;margin-top:14px}.links a{color:#2563eb;text-decoration:none;font-weight:800}</style></head>
<body><main class="box"><div style="font-size:40px">🌐</div><h1>Nurjahan.com</h1><p class="muted">আপনার অ্যাকাউন্টে Sign in করুন এবং ওয়েবসাইট তৈরির কাজ চালিয়ে যান।</p>
<form id="form"><label>Email</label><input class="input" id="email" type="email" autocomplete="email" required><label>Password</label><input class="input" id="password" type="password" autocomplete="current-password" required><button class="submit" id="submit">🔑 Sign in</button></form>
<div id="status" class="status">Firebase Authentication-এর মাধ্যমে নিরাপদে Sign in করুন।</div><div class="links"><a href="register.html">✨ Create account</a><a href="index.html">← Home</a></div></main>
<script type="module">import{auth,signInWithEmailAndPassword,onAuthStateChanged}from'./firebase-config.js';const f=document.getElementById('form'),s=document.getElementById('status'),b=document.getElementById('submit');f.onsubmit=async e=>{e.preventDefault();b.disabled=true;s.textContent='⏳ Sign in হচ্ছে...';try{const c=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);s.textContent='✅ Sign in সফল: '+c.user.email;setTimeout(()=>location.href='index.html',500)}catch(err){s.textContent='❌ '+(err?.message||'Sign in failed')}finally{b.disabled=false}};onAuthStateChanged(auth,u=>{if(u)s.textContent='✅ Signed in: '+u.email});</script><script src="./locale-content.js?v=10"></script><script src="./menu-locale.js?v=4"></script></body></html>
