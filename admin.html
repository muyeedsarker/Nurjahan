<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ecommerce-theme.css"><link rel="preconnect" href="https://www.gstatic.com" crossorigin><title>Nurjahan.com — Admin Payment</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#111827,#2563eb);color:#fff;border-radius:22px;padding:22px;margin-bottom:16px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px #0001}.pay{border:1px solid #dbe3ef;border-radius:14px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}button{padding:11px;border:0;border-radius:10px;font-weight:800;color:#fff;cursor:pointer}.approve{background:#16a34a}.reject{background:#dc2626}.live{background:#2563eb}.status{padding:9px;border-radius:9px;background:#f1f5f9;margin-top:10px}@media(max-width:650px){.grid,.actions{grid-template-columns:1fr}}.nj-application{padding:14px;border:1px solid #dbe4f0;border-radius:14px;margin:10px 0;background:#f8fbff}.nj-application b{display:block;margin-bottom:5px}.nj-application button{margin:8px 6px 0 0;padding:9px 12px;border:0;border-radius:9px;color:#fff;font-weight:800}.nj-accept{background:#059669}.nj-reject{background:#dc2626}</style></head><body><section id="nj-training-admin" class="card"><h2>🎓 প্রশিক্ষণ আবেদন</h2><p class="muted">প্রশিক্ষণ কেন্দ্রের আবেদনগুলো এখানে পরিচালনা করুন।</p><div id="nj-training-list">⏳ আবেদন তালিকা প্রস্তুত হচ্ছে…</div></section><main class="wrap"><section class="hero"><h1>🔐 Nurjahan.com Admin</h1><div>প্রিমিয়াম ৳399/মাস পেমেন্ট যাচাই করুন → অনুমোদন করলে ওয়েবসাইট লাইভ ও সাবস্ক্রিপশন চালু হবে।</div></section><section class="card"><button onclick="loadPayments()" style="background:#2563eb;width:100%">🔄 অপেক্ষমাণ পেমেন্ট রিফ্রেশ</button><div id="list" class="status">লোড হচ্ছে...</div></section></main><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script><script type="module">import{db,app}from'./firebase-config.js';import{collection,query,where,getDocs}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-functions.js';const list=document.getElementById('list');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function loadPayments(){list.textContent='লোড হচ্ছে...';try{const q=query(collection(db,'payments'),where('status','==','pending'));const snap=await getDocs(q);if(snap.empty){list.textContent='বর্তমানে কোনো Pending Payment নেই।';return}list.innerHTML=[...snap.docs].map(d=>{const p=d.data();return`<div class="pay"><b>Website:</b> ${esc(p.websiteName)}<div class="grid"><div><b>প্যাকেজ:</b> ${esc(p.packageName||'')}</div><div><b>পরিমাণ:</b> ৳${esc(p.amount)}</div><div><b>ধরন:</b> ${esc((p.billing||'monthly')==='one-time'?'এককালীন':'মাসিক')}</div><div><b>পদ্ধতি:</b> ${esc(p.method)}</div><div><b>প্রেরকের নম্বর:</b> ${esc(p.senderPhone)}</div><div><b>TRX ID:</b> ${esc(p.trxId)}</div><div><b>বিলিং:</b> ${esc(p.billing||'monthly')}</div></div><small>Payment ID: ${esc(d.id)}<br>Website ID: ${esc(p.websiteId||'নেই')}<br>${(p.packageName||'')==='E-commerce'?'❤️‍🩹 ১ বছরের সাপোর্ট':'📅 মাসিক সাবস্ক্রিপশন'}</small><div class="actions"><button class="approve" onclick="review('${d.id}','approved','${esc(p.websiteId||'')}')">✅ অনুমোদন করে লাইভ করুন</button><button class="reject" onclick="review('${d.id}','rejected','${esc(p.websiteId||'')}')">❌ বাতিল করুন</button>${p.websiteId?`<button class="live" onclick="openLive('${esc(p.websiteId)}')">🌐 লাইভ প্রিভিউ</button>`:''}</div></div>`}).join('')}catch(e){list.textContent='❌ Load হয়নি: '+e.message}}const functions=getFunctions(app);const reviewPayment=httpsCallable(functions,'reviewPayment');async function review(id,status,websiteId){try{const result=await reviewPayment({paymentId:id,action:status});await loadPayments();alert(result.data?.status==='approved'?'✅ পেমেন্ট অনুমোদিত — ওয়েবসাইট Live এবং মাসিক Subscription চালু হয়েছে!':'❌ পেমেন্ট বাতিল করা হয়েছে।')}catch(e){alert(e?.message||'Update হয়নি।')}}function openLive(id){window.open('live.html?id='+encodeURIComponent(id),'_blank')}window.loadPayments=loadPayments;window.review=review;window.openLive=openLive;loadPayments();</script><script src="./locale-content.js?v=3"></script><script src="./menu-locale.js?v=3"></script><script id="nj-training-admin-script">
(()=>{const el=document.getElementById('nj-training-list');if(!el)return;async function load(){el.innerHTML='⏳ আবেদন লোড হচ্ছে…';try{const m=await import('./firebase-config.js');const{getFunctions,httpsCallable}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-functions.js');const call=httpsCallable(getFunctions(m.app),'listTrainingApplications');const res=await call({});const apps=res.data?.applications||[];if(!apps.length){el.innerHTML='<div class="muted">এখনও কোনো বাস্তব আবেদন পাওয়া যায়নি।</div>';return}el.innerHTML=apps.map(a=>'<div class="nj-application"><b>📚 '+esc(a.course||'কোর্স')+'</b><div>👤 '+esc(a.name||'')+'</div><div>📱 '+esc(a.phone||'')+'</div><div>📍 '+esc(a.address||'')+'</div><div>🏢 Website ID: '+esc(a.websiteId||'')+'</div><div>📌 অবস্থা: '+(a.status==='accepted'?'✅ গ্রহণ করা হয়েছে':a.status==='rejected'?'❌ বাতিল করা হয়েছে':'⏳ অপেক্ষমাণ')+'</div><button class="nj-accept" onclick="njTrainingStatus(\''+a.id+'\',\'accepted\')">✅ গ্রহণ</button><button class="nj-reject" onclick="njTrainingStatus(\''+a.id+'\',\'rejected\')">❌ বাতিল</button></div>').join('')}catch(e){el.innerHTML='<div class="muted">❌ আবেদন লোড হয়নি: '+esc(e.message)+'</div>'}}window.njTrainingStatus=async(id,status)=>{try{const m=await import('./firebase-config.js');const{getFunctions,httpsCallable}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-functions.js');await httpsCallable(getFunctions(m.app),'reviewTrainingApplication')({applicationId:id,status});await load()}catch(e){alert(e?.message||'Update হয়নি।')}};window.loadTrainingApplications=load;load()})();</script></body></html>
