<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nurjahan.com — Admin Payment</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#111827,#2563eb);color:#fff;border-radius:22px;padding:22px;margin-bottom:16px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px #0001}.pay{border:1px solid #dbe3ef;border-radius:14px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{padding:11px;border:0;border-radius:10px;font-weight:800;color:#fff;cursor:pointer}.approve{background:#16a34a}.reject{background:#dc2626}.status{padding:9px;border-radius:9px;background:#f1f5f9;margin-top:10px}@media(max-width:650px){.grid,.actions{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>🔐 Nurjahan.com Admin</h1><div>Pending Payment যাচাই করে Approve / Reject করুন।</div></section><section class="card"><button onclick="loadPayments()" style="background:#2563eb;width:100%">🔄 Pending Payments Refresh</button><div id="list" class="status">লোড হচ্ছে...</div></section></main><script type="module">import{db}from'./firebase-config.js';import{collection,query,where,getDocs,doc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';const list=document.getElementById('list');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function loadPayments(){list.textContent='লোড হচ্ছে...';try{const q=query(collection(db,'payments'),where('status','==','pending'));const snap=await getDocs(q);if(snap.empty){list.textContent='বর্তমানে কোনো Pending Payment নেই।';return}list.innerHTML=[...snap.docs].map(d=>{const p=d.data();return`<div class="pay"><b>Website:</b> ${esc(p.websiteName)}<div class="grid"><div><b>Method:</b> ${esc(p.method)}</div><div><b>Amount:</b> ৳${esc(p.amount)}</div><div><b>Sender:</b> ${esc(p.senderPhone)}</div><div><b>TRX ID:</b> ${esc(p.trxId)}</div></div><small>ID: ${esc(d.id)}</small><div class="actions"><button class="approve" onclick="review('${d.id}','approved')">✅ Approve</button><button class="reject" onclick="review('${d.id}','rejected')">❌ Reject</button></div></div>`}).join('')}catch(e){list.textContent='❌ Load হয়নি: '+e.message}}async function review(id,status){try{await updateDoc(doc(db,'payments',id),{status,reviewedAt:serverTimestamp()});await loadPayments()}catch(e){alert('Update হয়নি: '+e.message)}}window.loadPayments=loadPayments;window.review=review;loadPayments();</script></body></html>
