<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nurjahan.com — Live Website</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:16px}.head{background:linear-gradient(135deg,#0f172a,#2563eb);color:#fff;border-radius:22px;padding:30px;margin-bottom:16px}.head h1{margin:0 0 6px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 8px 28px #0001}.box{background:#f7f9fc;border-radius:13px;padding:15px;margin:10px 0}.call{display:inline-block;background:#16a34a;color:#fff;padding:11px 16px;border-radius:10px;text-decoration:none;font-weight:800}.muted{color:#64748b}.error{color:#b91c1c;background:#fef2f2;padding:14px;border-radius:10px}</style></head><body><main class="wrap"><div id="app"><section class="card">লোড হচ্ছে...</section></div></main><script type="module">import{db}from'./firebase-config.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=new URLSearchParams(location.search).get('id');async function load(){if(!id){app.innerHTML='<section class="card error">❌ Website ID পাওয়া যায়নি।</section>';return}try{const snap=await getDoc(doc(db,'websites',id));if(!snap.exists()){app.innerHTML='<section class="card error">❌ Website পাওয়া যায়নি।</section>';return}const d=snap.data();if(d.status!=='live'&&d.status!=='paid'&&d.status!=='published'){app.innerHTML='<section class="card"><h2>⏳ Website এখনো Live নয়</h2><p class="muted">Payment Approve হওয়ার পর Website চালু হবে।</p></section>';return}const items=d.services||['মানসম্মত সেবা','সহযোগিতা ও পরামর্শ','সহজ যোগাযোগ'];app.innerHTML=`<section class="head"><h1>${esc(d.title||d.name)}</h1><div>${esc(d.type||'Business')}</div></section><section class="card"><div class="box"><h2>আমাদের সম্পর্কে</h2><p>${esc(d.desc||'')}</p></div><div class="box"><h2>🛠️ সেবাসমূহ</h2><ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="box"><h2>📍 ঠিকানা</h2><p>${esc(d.address||'বাংলাদেশ')}</p></div><div class="box"><h2>📞 যোগাযোগ</h2><p>${esc(d.phone||'')}</p>${d.phone?`<a class="call" href="tel:${esc(d.phone)}">কল করুন</a>`:''}</div></section>`}catch(e){app.innerHTML='<section class="card error">❌ Website load হয়নি: '+esc(e.message)+'</section>'}}load();</script></body></html>
