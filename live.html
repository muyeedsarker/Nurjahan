<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ecommerce-theme.css"><link rel="preconnect" href="https://www.gstatic.com" crossorigin><title>Nurjahan.com — Live Website</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:16px}.head{background:linear-gradient(135deg,#0f172a,#2563eb);color:#fff;border-radius:22px;padding:30px;margin-bottom:16px}.head h1{margin:0 0 6px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 8px 28px #0001}.box{background:#f7f9fc;border-radius:13px;padding:15px;margin:10px 0}.call{display:inline-block;background:#16a34a;color:#fff;padding:11px 16px;border-radius:10px;text-decoration:none;font-weight:800}.muted{color:#64748b}.error{color:#b91c1c;background:#fef2f2;padding:14px;border-radius:10px} .live-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.live-item{padding:14px;border:1px solid #e2e8f0;border-radius:14px;background:linear-gradient(145deg,#fff,#f8fbff)}.live-item span{color:#16a34a;font-weight:900;margin-right:6px}.live-item small{display:block;color:#64748b;margin-top:4px}@media(max-width:560px){.live-grid{grid-template-columns:1fr}} </style></head><body><main class="wrap"><div id="app"><section class="card">লোড হচ্ছে...</section></div></main><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script><script type="module">import{db}from'./firebase-config.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=new URLSearchParams(location.search).get('id');async function load(){if(!id){app.innerHTML='<section class="card error">❌ ওয়েবসাইট আইডি পাওয়া যায়নি।</section>';return}try{const snap=await getDoc(doc(db,'websites',id));if(!snap.exists()){app.innerHTML='<section class="card error">❌ ওয়েবসাইট পাওয়া যায়নি।</section>';return}const d=snap.data();if(d.status!=='live'){app.innerHTML='<section class="card"><h2>⏳ ওয়েবসাইট এখনো লাইভ নয়</h2><p class="muted">পেমেন্ট অনুমোদনের পর ওয়েবসাইট চালু হবে।</p></section>';return}const items=d.services||['মানসম্মত সেবা','সহযোগিতা ও পরামর্শ','সহজ যোগাযোগ'];app.innerHTML=`<section class="head"><h1>${esc(d.title||d.name)}</h1><div>${esc(d.type||'Business')}</div></section><section class="card"><div class="box"><h2>✨ আমাদের সম্পর্কে</h2><p>${esc(d.desc||'আপনার ব্যবসার তথ্য ও সেবা সম্পর্কে জানতে এখানে দেখুন।')}</p></div><div class="box"><h2>🛠️ সেবাসমূহ</h2><div class="live-grid">${items.map(x=>`<div class="live-item"><span>✓</span><b>${esc(x)}</b><small>মানসম্মত ও সহজ সেবা</small></div>`).join('')}</div></div><div class="box"><h2>📍 ঠিকানা</h2><p>${esc(d.address||'বাংলাদেশ')}</p></div><div class="box"><h2>📞 যোগাযোগ</h2><p>${esc(d.phone||'')}</p>${d.phone?`<a class="call" href="tel:${esc(d.phone)}">📞 কল করুন</a>`:''}</div></section>`}catch(e){app.innerHTML='<section class="card error">❌ ওয়েবসাইট লোড হয়নি: '+esc(e.message)+'</section>'}}load();</script><script src="./locale-content.js?v=3"></script><script src="./menu-locale.js?v=3"></script></body></html>
