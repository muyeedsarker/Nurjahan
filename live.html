<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ecommerce-theme.css"><link rel="preconnect" href="https://www.gstatic.com" crossorigin><title>Nurjahan.com — Live Website</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:16px}.head{background:linear-gradient(135deg,#0f172a,#2563eb);color:#fff;border-radius:22px;padding:30px;margin-bottom:16px}.head h1{margin:0 0 6px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 8px 28px #0001}.box{background:#f7f9fc;border-radius:13px;padding:15px;margin:10px 0}.call{display:inline-block;background:#16a34a;color:#fff;padding:11px 16px;border-radius:10px;text-decoration:none;font-weight:800}.muted{color:#64748b}.error{color:#b91c1c;background:#fef2f2;padding:14px;border-radius:10px} .live-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.live-item{padding:14px;border:1px solid #e2e8f0;border-radius:14px;background:linear-gradient(145deg,#fff,#f8fbff)}.live-item span{color:#16a34a;font-weight:900;margin-right:6px}.live-item small{display:block;color:#64748b;margin-top:4px}@media(max-width:560px){.live-grid{grid-template-columns:1fr}} .live-products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.live-product{padding:15px;border:1px solid #dbe4f0;border-radius:14px;background:#f8fbff}.live-product span{display:block;color:#64748b;font-size:13px;margin-top:5px}@media(max-width:560px){.live-products{grid-template-columns:1fr}}</style><style id="nj-ecom-css">
.nj-shop{margin-top:18px}.nj-products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.nj-p{padding:16px;border:1px solid #dbe4f0;border-radius:18px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.06)}.nj-p h3{margin:6px 0}.nj-price{font-weight:800;font-size:20px}.nj-add{margin-top:10px;width:100%;border:0;border-radius:12px;padding:12px;background:#2563eb;color:#fff;font-weight:700}.nj-cart{margin-top:16px;padding:16px;border-radius:18px;background:#f8fafc;border:1px solid #dbe4f0}.nj-cart-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #e2e8f0}.nj-checkout{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.nj-checkout input,.nj-checkout textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box}.nj-checkout textarea{grid-column:1/-1;min-height:80px}.nj-order{grid-column:1/-1;border:0;border-radius:12px;padding:13px;background:#16a34a;color:#fff;font-weight:800}@media(max-width:700px){.nj-products{grid-template-columns:1fr 1fr}}@media(max-width:480px){.nj-products,.nj-checkout{grid-template-columns:1fr}.nj-checkout textarea{grid-column:auto}}
</style></head><body><main class="wrap"><div id="app"><section class="card">লোড হচ্ছে...</section></div><section id="nj-ecom-live" class="card" style="display:none"><h2>🛒 অনলাইন শপ</h2><div class="live-products"><div class="live-product"><b>📦 পণ্য তালিকা</b><span>আপনার পণ্য এখানে প্রদর্শিত হবে</span></div><div class="live-product"><b>🛍️ কার্ট</b><span>সহজে পণ্য যোগ ও অর্ডার</span></div><div class="live-product"><b>🧾 অর্ডার</b><span>অর্ডার তথ্য ও স্ট্যাটাস</span></div><div class="live-product"><b>💳 Checkout</b><span>সহজ Checkout ব্যবস্থা</span></div></div></section><section id="nj-ecom-shop" class="card nj-shop" style="display:none"><h2>🛒 অনলাইন শপ</h2><p>পণ্য নির্বাচন করুন, কার্টে যোগ করুন এবং অর্ডার তথ্য দিন।</p><div id="nj-products" class="nj-products"></div><div class="nj-cart"><h3>🛍️ আপনার কার্ট</h3><div id="nj-cart-items">কার্ট খালি</div><strong>মোট: ৳<span id="nj-total">0</span></strong><div class="nj-checkout"><input id="nj-name" placeholder="আপনার নাম"><input id="nj-phone" placeholder="মোবাইল নম্বর"><textarea id="nj-address" placeholder="ডেলিভারি ঠিকানা"></textarea><button class="nj-order" id="nj-order">🧾 অর্ডার প্লেস করুন</button></div></div></section></main><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script><script type="module">import{db}from'./firebase-config.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=new URLSearchParams(location.search).get('id');async function load(){if(!id){app.innerHTML='<section class="card error">❌ ওয়েবসাইট আইডি পাওয়া যায়নি।</section>';return}try{const snap=await getDoc(doc(db,'websites',id));if(!snap.exists()){app.innerHTML='<section class="card error">❌ ওয়েবসাইট পাওয়া যায়নি।</section>';return}const d=snap.data();if(d.status!=='live'){app.innerHTML='<section class="card"><h2>⏳ ওয়েবসাইট এখনো লাইভ নয়</h2><p class="muted">পেমেন্ট অনুমোদনের পর ওয়েবসাইট চালু হবে।</p></section>';return}const items=d.services||['মানসম্মত সেবা','সহযোগিতা ও পরামর্শ','সহজ যোগাযোগ'];app.innerHTML=`<section class="head"><h1>${esc(d.title||d.name)}</h1><div>${esc(d.type||'Business')}</div></section><section class="card"><div class="box"><h2>✨ আমাদের সম্পর্কে</h2><p>${esc(d.desc||'আপনার ব্যবসার তথ্য ও সেবা সম্পর্কে জানতে এখানে দেখুন।')}</p></div><div class="box"><h2>🛠️ সেবাসমূহ</h2><div class="live-grid">${items.map(x=>`<div class="live-item"><span>✓</span><b>${esc(x)}</b><small>মানসম্মত ও সহজ সেবা</small></div>`).join('')}</div></div><div class="box"><h2>📍 ঠিকানা</h2><p>${esc(d.address||'বাংলাদেশ')}</p></div><div class="box"><h2>📞 যোগাযোগ</h2><p>${esc(d.phone||'')}</p>${d.phone?`<a class="call" href="tel:${esc(d.phone)}">📞 কল করুন</a>`:''}</div></section>`const eco=document.getElementById('nj-ecom-live');if(eco&&d.packageName==='E-commerce')eco.style.display='block';}catch(e){app.innerHTML='<section class="card error">❌ ওয়েবসাইট লোড হয়নি: '+esc(e.message)+'</section>'}}load();</script><script src="./locale-content.js?v=3"></script><script src="./menu-locale.js?v=3"></script><script id="nj-ecom-js">
(()=>{const shop=document.getElementById('nj-ecom-shop');const ps=[{n:'ডেমো পণ্য ১',p:499,e:'📦'},{n:'ডেমো পণ্য ২',p:799,e:'🛍️'},{n:'ডেমো পণ্য ৩',p:999,e:'✨'}];let cart=JSON.parse(localStorage.getItem('njCart')||'[]');const render=()=>{document.getElementById('nj-products').innerHTML=ps.map((x,i)=>'<div class="nj-p"><div style="font-size:34px">'+x.e+'</div><h3>'+x.n+'</h3><div class="nj-price">৳'+x.p+'</div><button class="nj-add" data-i="'+i+'">➕ কার্টে যোগ</button></div>').join('');document.querySelectorAll('.nj-add').forEach(b=>b.onclick=()=>{const x=ps[+b.dataset.i];cart.push(x);localStorage.setItem('njCart',JSON.stringify(cart));draw()});draw()};const draw=()=>{const el=document.getElementById('nj-cart-items');if(!cart.length){el.textContent='কার্ট খালি';document.getElementById('nj-total').textContent='0';return}el.innerHTML=cart.map((x,i)=>'<div class="nj-cart-row"><span>'+x.n+'</span><b>৳'+x.p+'</b></div>').join('');document.getElementById('nj-total').textContent=cart.reduce((a,x)=>a+x.p,0)};document.getElementById('nj-order').onclick=()=>{if(!cart.length)return alert('আগে কার্টে পণ্য যোগ করুন।');const n=document.getElementById('nj-name').value.trim(),ph=document.getElementById('nj-phone').value.trim(),a=document.getElementById('nj-address').value.trim();if(!n||!ph||!a)return alert('নাম, মোবাইল ও ঠিকানা পূরণ করুন।');localStorage.setItem('njOrderDraft',JSON.stringify({name:n,phone:ph,address:a,items:cart,total:cart.reduce((s,x)=>s+x.p,0),createdAt:new Date().toISOString()}));alert('অর্ডার তথ্য সংরক্ষণ হয়েছে। পরবর্তী ধাপে নিরাপদ সার্ভার অর্ডার সিস্টেম যুক্ত হবে।')};window.njEnableShop=()=>{if(shop){shop.style.display='block';render()}}})();
</script></body></html>
