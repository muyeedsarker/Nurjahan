<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ecommerce-theme.css"><title>Nurjahan.com — Theme Setup</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fbff;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:#0f172a}.box{width:min(430px,calc(100% - 32px));padding:28px;border:1px solid #dbeafe;border-radius:24px;background:#fff;box-shadow:0 20px 60px #0f172a18;text-align:center}.icon{font-size:46px}.ok{color:#059669;font-weight:900}.wait{color:#2563eb;font-weight:900}</style></head><body><main class="box"><div class="icon">🎨</div><h1>Nurjahan.com</h1><p id="status" class="wait">১৫টি Theme চালু করা হচ্ছে…</p></main><script>const s=document.getElementById('status');(async()=>{try{if(!('serviceWorker'in navigator))throw new Error('Service Worker unsupported');const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});await reg.update();s.textContent='✅ ১৫টি Theme সফলভাবে চালু হয়েছে।';s.className='ok';setTimeout(()=>location.href='./index.html?themes=15',900)}catch(e){s.textContent='⚠️ Theme Setup চালু হয়নি। আবার চেষ্টা করুন।';s.className='wait';console.error(e)}})();</script><script src="./locale-content.js?v=3"></script><script src="./menu-locale.js?v=3"></script></body></html>
