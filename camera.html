<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#0b1020"><title>Nurjahan.com — Premium Camera</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8fafc,#eef2ff);color:#172033;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}.wrap{max-width:760px;margin:auto;padding:14px}.back{display:inline-block;margin:4px 0 12px;color:#334155;text-decoration:none;font-weight:800}.head{background:rgba(255,255,255,.92);border:1px solid #e2e8f0;border-radius:24px;padding:17px;margin-bottom:14px;box-shadow:0 12px 35px #0f172a12}.head h1{margin:0 0 4px;font-size:24px}.head p{margin:0;color:#64748b;font-size:13px}.camera{background:#080b12;border:1px solid #334155;border-radius:28px;overflow:hidden;box-shadow:0 22px 70px #0f172a35}.stage{position:relative;background:#020409;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}.stage video,.stage canvas{width:100%;height:100%;object-fit:cover;display:block}.stage canvas{display:none}.topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}.glass{border:1px solid #fff3;background:#0b1020b8;color:#fff;backdrop-filter:blur(14px);border-radius:999px;padding:9px 12px;font-weight:800;font-size:13px;box-shadow:0 8px 25px #0005}.gridline{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 32.9%,#fff6 33%,transparent 33.1%,transparent 66.2%,#fff6 66.3%,transparent 66.4%),linear-gradient(0deg,transparent 32.9%,#fff6 33%,transparent 33.1%,transparent 66.2%,#fff6 66.3%,transparent 66.4%);display:none}.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 13px;border:1px solid #fff2;border-radius:999px;background:#0009;color:#fff;font-size:12px;white-space:nowrap}.controls{display:flex;align-items:center;justify-content:center;gap:18px;padding:16px 14px;background:linear-gradient(#111827,#080b12)}.round{width:50px;height:50px;border:1px solid #ffffff28;border-radius:50%;background:#ffffff0d;color:#fff;font-size:21px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(12px)}.round:disabled{opacity:.35}.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;position:relative;cursor:pointer;box-shadow:0 0 0 5px #ffffff18,0 8px 25px #0008}.shutter:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}.tool{border:1px solid #dbe3ee;border-radius:16px;padding:13px;background:#fff;color:#172033;font-weight:900;cursor:pointer;box-shadow:0 8px 24px #0f172a0b}.tool.primary{background:#172554;color:#fff;border-color:#172554}.tool input{display:none}.settings{margin-top:12px;background:#fff;border:1px solid #dbe3ee;border-radius:20px;padding:15px;display:none;box-shadow:0 12px 35px #0f172a12}.settings.open{display:block}.settings h3{margin:0 0 12px}.setting-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.setting-row label{font-size:12px;font-weight:900;color:#475569}.setting-row select,.setting-row input[type=range]{width:100%;margin-top:6px}.setting-row select{padding:11px;border:1px solid #dbe3ee;border-radius:12px;background:#fff}.switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #eef2f7}.switch input{width:20px;height:20px}.cap-note,.status{font-size:12px;color:#64748b;margin-top:8px}.post{margin-top:14px;background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:16px;box-shadow:0 10px 30px #0f172a0d}.post textarea{width:100%;min-height:90px;border:1px solid #dbe3ee;border-radius:15px;padding:12px;font:inherit;resize:vertical}.preview{display:none;margin-top:12px;border-radius:16px;overflow:hidden;background:#eef2f7}.preview img{display:block;width:100%;height:auto}.publish{width:100%;margin-top:10px;border:0;border-radius:15px;padding:14px;background:#172554;color:#fff;font-weight:900;font-size:16px;box-shadow:0 10px 25px #17255435}@media(max-width:500px){.wrap{padding:9px}.controls{gap:13px}.round{width:46px;height:46px}.shutter{width:70px;height:70px}.tools{grid-template-columns:1fr 1fr}.setting-row{grid-template-columns:1fr}} </style></head><body><main class="wrap"><a class="back" href="index.html">← Nurjahan.com</a><section class="head"><h1>📷 Premium Camera</h1><p>সরাসরি ছবি তুলুন • সুন্দরভাবে সাজান • তারপর পোস্ট করুন</p></section><section class="camera"><div class="stage"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><div class="topbar"><button class="glass" id="settingsBtn">⚙️ Settings</button><span class="glass" id="qualityBadge">HD</span></div><div class="gridline" id="grid"></div><div class="hint" id="hint">ক্যামেরা প্রস্তুত করুন</div></div><div class="controls"><button class="round" id="flip" aria-label="Switch camera">↻</button><button class="shutter" id="capture" aria-label="Take photo"></button><button class="round" id="retake" disabled aria-label="Retake">↩</button></div></section><div class="tools"><label class="tool">🖼️ Gallery<input id="file" type="file" accept="image/*"></label><button class="tool primary" id="start">📷 Camera</button><button class="tool" id="settingsOpen">⚙️ Settings</button></div><section class="settings" id="settings"><h3>⚙️ Camera Settings</h3><div class="setting-row"><label>ছবির মান<select id="quality"><option value="1920">Ultra HD • 1920px</option><option value="1600" selected>High • 1600px</option><option value="1280">Standard • 1280px</option></select></label><label>Aspect Ratio<select id="ratio"><option value="4/3" selected>4:3</option><option value="16/9">16:9</option><option value="1/1">1:1</option></select></label></div><div class="setting-row"><label>Timer<select id="timer"><option value="0">Off</option><option value="3">3 sec</option><option value="5">5 sec</option><option value="10">10 sec</option></select></label><label>Camera<select id="cameraChoice"><option value="environment">Back Camera</option><option value="user">Front Camera</option></select></label></div><div class="setting-row"><label>Zoom<input id="zoom" type="range" min="1" max="1" step=".1" value="1"><span id="zoomValue">1×</span></label><label>Flash<select id="flash"><option value="auto">Auto</option><option value="on">On</option><option value="off">Off</option></select></label></div><div class="switch"><span>📐 Rule of thirds grid</span><input id="gridToggle" type="checkbox"></div><div class="switch"><span>✨ Mirror selfie preview</span><input id="mirrorToggle" type="checkbox"></div><div class="cap-note" id="capNote">আপনার ফোন যে camera controls সমর্থন করে, সেগুলো ব্যবহার করা হবে।</div></section><section class="post"><textarea id="caption" placeholder="ছবির সাথে কিছু লিখুন…"></textarea><div class="preview" id="preview"><img id="photo" alt="Captured photo"></div><button class="publish" id="publish" disabled>📤 Post করুন</button><div class="status" id="status">ছবি তুললে পোস্ট করার অপশন আসবে।</div></section></main><script>const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),photo=$('photo'),capture=$('capture'),retake=$('retake'),flip=$('flip'),start=$('start'),file=$('file'),publish=$('publish'),preview=$('preview'),hint=$('hint'),status=$('status'),settings=$('settings'),settingsBtn=$('settingsBtn'),settingsOpen=$('settingsOpen'),quality=$('quality'),qualityBadge=$('qualityBadge'),ratio=$('ratio'),timer=$('timer'),cameraChoice=$('cameraChoice'),zoom=$('zoom'),zoomValue=$('zoomValue'),flash=$('flash'),grid=$('grid'),gridToggle=$('gridToggle'),mirrorToggle=$('mirrorToggle'),capNote=$('capNote');let stream=null,facing='environment',imageData='';settingsBtn.onclick=()=>settings.classList.toggle('open');settingsOpen.onclick=()=>{settings.classList.toggle('open');settings.scrollIntoView({behavior:'smooth',block:'nearest'})};function rv(){const [w,h]=ratio.value.split('/').map(Number);return w/h}async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());facing=cameraChoice.value;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080},aspectRatio:{ideal:rv()}},audio:false});video.srcObject=stream;video.style.display='block';canvas.style.display='none';video.style.transform=mirrorToggle.checked&&facing==='user'?'scaleX(-1)':'none';hint.textContent='ক্যামেরা প্রস্তুত • ছবি তুলুন';const track=stream.getVideoTracks()[0],caps=track.getCapabilities?.()||{};zoom.disabled=!caps.zoom;if(caps.zoom){zoom.min=caps.zoom.min;zoom.max=caps.zoom.max;zoom.step=caps.zoom.step||.1;zoom.value=Math.min(caps.zoom.max,Math.max(caps.zoom.min,1))}flash.disabled=!caps.torch;capNote.textContent=`${track.label||'Camera'} • ${caps.zoom?'Zoom supported':'Zoom unavailable'}${caps.torch?' • Flash supported':''}`}catch(e){hint.textContent='Camera permission প্রয়োজন';status.textContent='Browser camera permission দিন এবং HTTPS ব্যবহার করুন।'}}function showImage(src){imageData=src;photo.src=src;preview.style.display='block';publish.disabled=false;status.textContent='ছবি প্রস্তুত। এখন Post করতে পারবেন।'}async function takePhoto(){if(!stream)return;let n=Number(timer.value);if(n){while(n){hint.textContent=`ছবি তোলা হবে ${n} সেকেন্ড পরে`;await new Promise(r=>setTimeout(r,1000));n--}}const w=video.videoWidth||1920,h=video.videoHeight||1080,max=Number(quality.value);let cw=Math.min(w,max),ch=Math.round(cw/(w/h)),target=rv();if(cw/ch>target)cw=Math.round(ch*target);else ch=Math.round(cw/target);canvas.width=cw;canvas.height=ch;const ctx=canvas.getContext('2d');ctx.save();if(mirrorToggle.checked&&facing==='user'){ctx.translate(cw,0);ctx.scale(-1,1)}ctx.drawImage(video,0,0,cw,ch);ctx.restore();showImage(canvas.toDataURL('image/jpeg',.92));video.style.display='none';canvas.style.display='block';retake.disabled=false;hint.textContent='ছবি প্রস্তুত'}capture.onclick=takePhoto;retake.onclick=()=>{preview.style.display='none';publish.disabled=true;imageData='';video.style.display='block';canvas.style.display='none';hint.textContent='ক্যামেরা প্রস্তুত'};flip.onclick=()=>{cameraChoice.value=cameraChoice.value==='environment'?'user':'environment';startCamera()};start.onclick=startCamera;cameraChoice.onchange=startCamera;ratio.onchange=startCamera;quality.onchange=()=>qualityBadge.textContent=quality.value==='1920'?'UHD':quality.value==='1600'?'HD':'STD';zoom.oninput=()=>{zoomValue.textContent=`${Number(zoom.value).toFixed(1)}×`;if(stream)stream.getVideoTracks()[0].applyConstraints({advanced:[{zoom:Number(zoom.value)}]}).catch(()=>{})};gridToggle.onchange=()=>grid.style.display=gridToggle.checked?'block':'none';mirrorToggle.onchange=()=>video.style.transform=mirrorToggle.checked&&facing==='user'?'scaleX(-1)':'none';flash.onchange=()=>{if(!stream||flash.disabled)return;const t=stream.getVideoTracks()[0];t.applyConstraints({advanced:[{torch:flash.value==='on'}]}).catch(()=>{status.textContent='এই ফোনে Flash control নেই।'})};file.onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>showImage(r.result);r.readAsDataURL(f)};publish.onclick=()=>{if(!imageData)return;const posts=JSON.parse(localStorage.getItem('nurjahanCameraPosts')||'[]');posts.unshift({image:imageData,caption:$('caption').value.trim(),createdAt:new Date().toISOString()});localStorage.setItem('nurjahanCameraPosts',JSON.stringify(posts.slice(0,20)));status.textContent='✅ Post সংরক্ষণ হয়েছে।';publish.disabled=true};if(navigator.mediaDevices?.getUserMedia)startCamera();else hint.textContent='এই browser Camera API সমর্থিত নয়';window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));</script></body></html>
