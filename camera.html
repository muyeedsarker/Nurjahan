<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Nurjahan.com Camera</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}.wrap{max-width:760px;margin:auto;padding:10px}.back{display:inline-block;margin:2px 0 8px;color:#334155;text-decoration:none;font-weight:800;font-size:13px}.camera{background:#080b12;border:1px solid #334155;border-radius:26px;overflow:hidden;box-shadow:0 22px 70px #0f172a35}.stage{position:relative;background:#020409;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}.stage video,.stage canvas{width:100%;height:100%;object-fit:cover;display:block}.stage canvas{display:none}.topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;z-index:20}.top-actions{display:flex;gap:6px;align-items:center}.camera-toggle,.hd-button,.light-button,.settings-button{border:1px solid #ffffff35;background:#0b1020d9;color:#fff;backdrop-filter:blur(14px);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;line-height:1;cursor:pointer;box-shadow:0 8px 24px #0006}.hd-button,.light-button,.settings-button{padding:8px 10px;min-width:36px;text-align:center}.settings-button{font-size:14px}.flip-top{width:36px;height:36px;padding:0;font-size:16px;min-height:36px}.flip-top:active{transform:scale(.96)}.camera-toggle:active,.hd-button:active,.settings-button:active{transform:scale(.96)}.settings-panel{position:absolute;top:48px;right:10px;width:min(250px,calc(100% - 20px));z-index:19;background:#0b1020ed;border:1px solid #ffffff20;border-radius:14px;padding:8px;display:none;box-shadow:0 14px 40px #0008;backdrop-filter:blur(18px)}.settings-panel.open{display:block}.setting-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.setting-grid select{width:100%;border:1px solid #ffffff20; </style></head><body class="nj-camera-page" data-nj-camera="isolated"><main class="wrap"><a class="back" href="index.html">← Nurjahan.com</a><section class="camera"><div class="stage"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><div class="topbar"><div class="top-actions"><button type="button" class="hd-button" id="quickHd" aria-label="HD">HD</button><button type="button" class="light-button" id="lightToggle" aria-label="Light">💡</button><button type="button" class="round flip-top" id="flip" aria-label="Mirror">🪞</button><button type="button" class="settings-button" id="settingsToggle" aria-label="Settings">⚙️</button></div></div><div class="settings-panel" id="settingsPanel"><div class="setting-grid"><div class="hdrow"><button type="button" data-q="1920">UHD</button><button type="button" data-q="1600" class="active">HD</button><button type="button" data-q="1280">STD</button></div><div><div class="mini">অনুপাত</div><select id="ratio"><option value="4/3" selected>4:3</option><option value="16/9">16:9</option><option value="1/1">1:1</option></select></div><div><div class="mini">টাইমার</div><select id="timer"><option value="0">Off</option><option value="3">3s</option><option value="5">5s</option><option value="10">10s</option></select></div><div><div class="mini">ক্যামেরা</div><select id="cameraChoice"><option value="environment">Back</option><option value="user">Front</option></select></div><div class="rangebox"><div class="mini">Zoom <span id="zoomValue">1×</span></div><input id="zoom" type="range" min="1" max="1" step=".1" value="1"></div><div><div class="mini">Flash</div><select id="flash"><option value="auto">Auto</option><option value="on">On</option><option value="off">Off</option></select></div><div class="switchrow"><span>Grid</span><input id="gridToggle" type="checkbox"></div><div class="switchrow"><span>Mirror</span><input id="mirrorToggle" type="checkbox"></div></div></div><div class="hint" id="hint"></div></div><div class="controls"><button type="button" class="shutter" id="capture" aria-label="Take photo"></button><button type="button" class="round" id="retake" disabled aria-label="Retake">↩</button></div></section><section class="post"><textarea id="caption" placeholder="ছবির সাথে কিছু লিখুন…"></textarea><div class="preview" id="preview"><img id="photo" alt="Captured photo"></div><button type="button" class="publish" id="publish" disabled>📤 Post</button><div class="status" id="status"></div></section></main><script>const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),photo=$('photo'),capture=$('capture'),retake=$('retake'),flip=$('flip'),publish=$('publish'),preview=$('preview'),hint=$('hint'),status=$('status'),panel=$('settingsPanel'),settingsToggle=$('settingsToggle'),quickHd=$('quickHd'),lightToggle=$('lightToggle'),ratio=$('ratio'),timer=$('timer'),cameraChoice=$('cameraChoice'),zoom=$('zoom'),zoomValue=$('zoomValue'),flash=$('flash'),gridToggle=$('gridToggle'),mirrorToggle=$('mirrorToggle');let stream=null,facing='environment',imageData='',quality=1600;settingsToggle.addEventListener('click',e=>{e.preventDefault();panel.classList.toggle('open')});lightToggle.addEventListener('click',()=>{if(!stream)return hint.textContent='📷 আগে ক্যামেরা চালু করুন';if(!stream.getVideoTracks()[0].getCapabilities?.().torch)return hint.textContent='💡 এই ফোনের ক্যামেরায় LED light নেই';const on=lightToggle.dataset.on!=='1';stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:on}]}).then(()=>{lightToggle.dataset.on=on?'1':'0';lightToggle.textContent=on?'💡✓':'💡';hint.textContent=on?'💡 লাইট চালু':'💡 লাইট বন্ধ'}).catch(()=>hint.textContent='⚠️ লাইট চালু করা যায়নি')});quickHd.addEventListener('click',()=>{quality=1600;document.querySelectorAll('[data-q]').forEach(x=>x.classList.remove('active'));document.querySelector('[data-q="1600"]').classList.add('active');quickHd.textContent='HD ✓';setTimeout(()=>quickHd.textContent='HD',700)});document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{quality=Number(b.dataset.q);document.querySelectorAll('[data-q]').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));function rv(){const [w,h]=ratio.value.split('/').map(Number);return w/h}async function startCamera(){try{if(!window.isSecureContext){hint.textContent="🔒 HTTPS প্রয়োজন—Nurjahan.com থেকেই ক্যামেরা খুলুন";return}if(!navigator.mediaDevices?.getUserMedia){hint.textContent="📷 এই ব্রাউজারে ক্যামেরা সাপোর্ট নেই";return}if(stream)stream.getTracks().forEach(t=>t.stop());lightToggle.dataset.on='0';lightToggle.textContent='💡';facing=cameraChoice.value;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080},aspectRatio:{ideal:rv()}},audio:false});video.srcObject=stream;video.style.display='block';canvas.style.display='none';video.style.transform=mirrorToggle.checked&&facing==='user'?'scaleX(-1)':'none';hint.textContent='';const track=stream.getVideoTracks()[0],caps=track.getCapabilities?.()||{};zoom.disabled=!caps.zoom;if(caps.zoom){zoom.min=caps.zoom.min;zoom.max=caps.zoom.max;zoom.step=caps.zoom.step||.1;zoom.value=Math.min(caps.zoom.max,Math.max(caps.zoom.min,1));zoomValue.textContent=`${Number(zoom.value).toFixed(1)}×`}flash.disabled=!caps.torch;lightToggle.disabled=!caps.torch}catch(e){const n=e?.name||"";hint.textContent=n==="NotAllowedError"?"🔒 ক্যামেরা অনুমতি দিন":n==="NotFoundError"?"📷 ক্যামেরা পাওয়া যায়নি":n==="NotReadableError"?"⚠️ ক্যামেরা অন্য অ্যাপে ব্যবহার হচ্ছে":n==="OverconstrainedError"?"⚙️ এই ক্যামেরা সেটিংটি সমর্থিত নয়":"⚠️ ক্যামেরা চালু করা যায়নি";}}function showImage(src){imageData=src;photo.src=src;preview.style.display='block';publish.disabled=false}async function takePhoto(){if(!stream)return;let n=Number(timer.value);if(n){while(n){await new Promise(r=>setTimeout(r,1000));n--}}const w=video.videoWidth||1920,h=video.videoHeight||1080,cw=Math.min(w,quality),ch=Math.round(cw/(w/h));canvas.width=cw;canvas.height=ch;const ctx=canvas.getContext('2d');ctx.save();if(mirrorToggle.checked&&facing==='user'){ctx.translate(cw,0);ctx.scale(-1,1)}ctx.drawImage(video,0,0,cw,ch);ctx.restore();showImage(canvas.toDataURL('image/jpeg',.92));video.style.display='none';canvas.style.display='block';retake.disabled=false}capture.addEventListener('click',takePhoto);retake.addEventListener('click',()=>{preview.style.display='none';publish.disabled=true;imageData='';video.style.display='block';canvas.style.display='none'});flip.addEventListener('click',()=>{mirrorToggle.checked=!mirrorToggle.checked;video.style.transform=mirrorToggle.checked&&facing==='user'?'scaleX(-1)':'none';hint.textContent=mirrorToggle.checked?'🪞 Mirror চালু':'🪞 Mirror বন্ধ'});cameraChoice.addEventListener('change',startCamera);ratio.addEventListener('change',startCamera);zoom.addEventListener('input',()=>{zoomValue.textContent=`${Number(zoom.value).toFixed(1)}×`;if(stream)stream.getVideoTracks()[0].applyConstraints({advanced:[{zoom:Number(zoom.value)}]}).catch(()=>{})});gridToggle.addEventListener('change',()=>{});mirrorToggle.addEventListener('change',()=>video.style.transform=mirrorToggle.checked&&facing==='user'?'scaleX(-1)':'none');flash.addEventListener('change',()=>{if(!stream||flash.disabled)return;stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:flash.value==='on'}]}).catch(()=>{})});publish.addEventListener('click',()=>{if(!imageData)return;const posts=JSON.parse(localStorage.getItem('nurjahanCameraPosts')||'[]');posts.unshift({image:imageData,caption:$('caption').value.trim(),createdAt:new Date().toISOString(),quality});localStorage.setItem('nurjahanCameraPosts',JSON.stringify(posts.slice(0,20)));status.textContent='✓';publish.disabled=true});if(navigator.mediaDevices?.getUserMedia)startCamera();window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));</script><script src="./locale-content.js?v=3"></script><script src="./menu-locale.js?v=3"></script></body></html>
