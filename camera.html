<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#080b12"><title>Nurjahan.com Camera</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}.wrap{max-width:760px;margin:auto;padding:10px}.back{display:inline-block;margin:2px 0 8px;color:#334155;text-decoration:none;font-weight:800;font-size:13px}.camera{background:#080b12;border:1px solid #334155;border-radius:26px;overflow:hidden;box-shadow:0 22px 70px #0f172a35}.stage{position:relative;background:#020409;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}.stage video,.stage canvas{width:100%;height:100%;object-fit:cover;display:block}.stage canvas{display:none}.topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:flex-start;gap:7px;z-index:20}.camera-toggle,.hd-toggle{border:1px solid #ffffff35;background:#0b1020d9;color:#fff;backdrop-filter:blur(14px);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;line-height:1;cursor:pointer;box-shadow:0 8px 24px #0006}.camera-toggle:active,.hd-toggle:active{transform:scale(.96)}.hd-toggle{min-width:38px;text-align:center}.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:6px 10px;border:1px solid #fff2;border-radius:999px;background:#0008;color:#fff;font-size:10px;white-space:nowrap}.controls{display:flex;align-items:center;justify-content:center;gap:18px;padding:13px;background:linear-gradient(#111827,#080b12)}.round{width:44px;height:44px;border:1px solid #ffffff28;border-radius:50%;background:#ffffff0d;color:#fff;font-size:19px;display:grid;place-items:center;cursor:pointer}.round:disabled{opacity:.35}.shutter{width:70px;height:70px;border-radius:50%;border:4px solid #fff;background:transparent;position:relative;cursor:pointer;box-shadow:0 0 0 4px #ffffff18,0 8px 25px #0008}.shutter:after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}.post{margin-top:10px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:12px}.post textarea{width:100%;min-height:65px;border:1px solid #dbe3ee;border-radius:12px;padding:10px;font:inherit;resize:vertical}.preview{display:none;margin-top:9px;border-radius:13px;overflow:hidden;background:#eef2f7}.preview img{display:block;width:100%;height:auto}.publish{width:100%;margin-top:8px;border:0;border-radius:12px;padding:11px;background:#172554;color:#fff;font-weight:900;font-size:14px}.status{font-size:11px;color:#64748b;margin-top:6px}@media(max-width:500px){.wrap{padding:7px}.camera{border-radius:22px}.controls{gap:13px}.round{width:42px;height:42px}.shutter{width:66px;height:66px}.post{padding:10px}}
</style></head><body><main class="wrap"><a class="back" href="index.html">← Nurjahan.com</a><section class="camera"><div class="stage"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><div class="topbar"><button type="button" class="camera-toggle" id="cameraToggle" aria-label="Camera">📷 ক্যামেরা</button><button type="button" class="hd-toggle" id="hdToggle" aria-label="HD quality">HD</button></div><div class="hint" id="hint"></div></div><div class="controls"><button type="button" class="round" id="flip" aria-label="Switch camera">↻</button><button type="button" class="shutter" id="capture" aria-label="Take photo"></button><button type="button" class="round" id="retake" disabled aria-label="Retake">↩</button></div></section><section class="post"><textarea id="caption" placeholder="ছবির সাথে কিছু লিখুন…"></textarea><div class="preview" id="preview"><img id="photo" alt="Captured photo"></div><button type="button" class="publish" id="publish" disabled>📤 Post</button><div class="status" id="status"></div></section></main><script>const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),photo=$('photo'),capture=$('capture'),retake=$('retake'),flip=$('flip'),publish=$('publish'),preview=$('preview'),hint=$('hint'),status=$('status'),hdToggle=$('hdToggle');let stream=null,facing='environment',imageData='',quality=1600;const qualityModes=[{label:'HD',value:1600},{label:'UHD',value:1920},{label:'STD',value:1280}];let qualityIndex=0;hdToggle.addEventListener('click',()=>{qualityIndex=(qualityIndex+1)%qualityModes.length;quality=qualityModes[qualityIndex].value;hdToggle.textContent=qualityModes[qualityIndex].label});async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;video.style.display='block';canvas.style.display='none';hint.textContent=''}catch(e){hint.textContent=''}}function showImage(src){imageData=src;photo.src=src;preview.style.display='block';publish.disabled=false}async function takePhoto(){if(!stream)return;const w=video.videoWidth||1920,h=video.videoHeight||1080,cw=Math.min(w,quality),ch=Math.round(cw/(w/h));canvas.width=cw;canvas.height=ch;const ctx=canvas.getContext('2d');ctx.drawImage(video,0,0,cw,ch);showImage(canvas.toDataURL('image/jpeg',.92));video.style.display='none';canvas.style.display='block';retake.disabled=false}capture.addEventListener('click',takePhoto);retake.addEventListener('click',()=>{preview.style.display='none';publish.disabled=true;imageData='';video.style.display='block';canvas.style.display='none'});flip.addEventListener('click',()=>{facing=facing==='environment'?'user':'environment';startCamera()});publish.addEventListener('click',()=>{if(!imageData)return;const posts=JSON.parse(localStorage.getItem('nurjahanCameraPosts')||'[]');posts.unshift({image:imageData,caption:$('caption').value.trim(),createdAt:new Date().toISOString(),quality});localStorage.setItem('nurjahanCameraPosts',JSON.stringify(posts.slice(0,20)));status.textContent='✓';publish.disabled=true});if(navigator.mediaDevices?.getUserMedia)startCamera();window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));</script></body></html>
