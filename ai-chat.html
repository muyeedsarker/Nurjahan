<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ecommerce-theme.css"><title>Nurjahan.com — AI Customer Chat</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:14px}.head{background:linear-gradient(135deg,#111827,#2563eb,#7c3aed);color:#fff;border-radius:24px;padding:22px;margin-bottom:12px}.head h1{margin:0 0 6px}.head p{margin:4px 0;opacity:.92}.chat{background:#fff;border:1px solid #dbe3ef;border-radius:20px;overflow:hidden;box-shadow:0 15px 50px #00000012}.log{height:62vh;min-height:420px;overflow:auto;padding:14px;background:#f8fafc}.m{max-width:88%;padding:11px 13px;border-radius:16px;margin:8px 0;line-height:1.55;white-space:pre-wrap}.bot{background:#fff;border:1px solid #e2e8f0}.user{margin-left:auto;background:#2563eb;color:#fff}.quick{display:flex;gap:6px;flex-wrap:wrap;padding:9px;border-top:1px solid #e2e8f0}.quick button{border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:8px 11px;font-weight:800}.form{display:flex;gap:7px;padding:10px;border-top:1px solid #e2e8f0}.form input{flex:1;min-width:0;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}.form button,.apply{border:0;border-radius:12px;background:#2563eb;color:#fff;padding:11px 16px;font-weight:900}.apply{display:none;margin:0 10px 10px;width:calc(100% - 20px);background:#16a34a}.back{display:inline-block;color:#fff;text-decoration:none;font-weight:800;margin-top:12px}</style></head><body><main class="wrap"><section class="head"><h1>🤖 Nurjahan AI Support</h1><p>Website তৈরি, Design, Features, Packages ও সাধারণ সমস্যায় AI সহায়তা।</p><a class="back" href="index.html">← Builder-এ ফিরে যান</a></section><section class="chat"><div id="log" class="log"><div class="m bot">আসসালামু আলাইকুম! 👋 আমি Nurjahan AI Assistant। আপনি কী ধরনের Website চান বা কোন Feature যোগ করতে চান বলুন।</div></div><div class="quick"><button data-q="আমার Electronics দোকানের Website চাই">📱 Electronics</button><button data-q="আমার Fashion দোকানের Website চাই">👕 Fashion</button><button data-q="আমার Restaurant-এর Website চাই">🍽️ Restaurant</button><button data-q="আমার Website-এ Online Order চাই">🛒 Online Order</button><button data-q="আমার Website-এ Booking চাই">📅 Booking</button></div><button id="apply" class="apply">⚡ এই প্রয়োজন Builder-এ প্রয়োগ করুন</button><form class="form" id="form"><input id="input" autocomplete="off" placeholder="আপনার প্রয়োজন লিখুন…"><button>Send</button></form></section></main><script type="module">const log=document.getElementById('log'),input=document.getElementById('input'),apply=document.getElementById('apply');let lastQuery='';function add(text,who){const d=document.createElement('div');d.className='m '+who;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight}async function ask(q){lastQuery=q;apply.style.display='none';add(q,'user');add('⏳ AI উত্তর প্রস্তুত করছে…','bot');try{const mod=await import('./ai-support.js');const fn=mod.askNurjahanAI||mod.askAI;if(typeof fn!=='function')throw Error('AI function unavailable');const answer=await fn(q);log.lastElementChild.remove();add(String(answer||'দুঃখিত, এখন উত্তর দিতে পারছি না।'),'bot');apply.style.display='block'}catch(e){log.lastElementChild.remove();add('এই মুহূর্তে AI সংযোগ পাওয়া যাচ্ছে না। অনুগ্রহ করে পরে আবার চেষ্টা করুন।','bot')}}apply.onclick=async()=>{if(!lastQuery)return;try{const {analyzeBuilderRequest,applyBuilderIntent}=await import('./ai-builder-engine.js');applyBuilderIntent(analyzeBuilderRequest(lastQuery))}catch(e){add('Builder সংযোগ করা যাচ্ছে না।','bot')}};document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(!q)return;input.value='';ask(q)});document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>ask(b.dataset.q));</script><script src="./locale-content.js?v=3"></script><script src="./menu-locale.js?v=3"></script></body></html>
